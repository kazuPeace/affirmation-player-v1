name: affirmation_player
description: "Music-player style affirmation app with VOICEVOX, TTS, and layered BGM playback."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  crypto: ^3.0.6
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/bgm/
    - assets/voicevox/dict/open_jtalk_dic_utf_8-1.11/
    - assets/voicevox/models/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/ChatGPT Image 2026年3月21日 19_39_16.png"
  adaptive_icon_background: "#111823"
  adaptive_icon_foreground: "assets/icon/ChatGPT Image 2026年3月21日 19_39_16.png"
  remove_alpha_ios: true
